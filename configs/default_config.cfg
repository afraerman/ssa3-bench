runs_quick    = 1
skip_first    = 20

[test_3.1]
model         = satform_polygons/sat_10.h5
orbit         = O1
attitude      = L2
gravity       = 20x20
integrator    = variable
duration_s    = 86400
duration_quick_s = 3600
