[general]
data_root     = /media/alexey/Disk1/asc/solar_pressure/ssa3       # корень каталогов моделей
results_root  = /media/alexey/Disk1/asc/solar_pressure/ssa3/out
P0            = 4.56e-6                       # Н/м² на 1 а.е.

[test_1.1]
models        = test_shapes/shape_2_square_2p6m.h5
methods       = CentroidGPU, CentroidCPU, CentroidRTX   # RTX пропускается без RT-ядер
reflections   = 0, 3
tol_force_rel = 1e-4
tol_moment    = 1e-5

[test_1.3]
models        = test_shapes/shape_2_square_2p6m.h5, satform_polygons/sat_03.h5
reflections   = 0, 3
methods       = CentroidGPU, CentroidCPU, CentroidRTX
tol_force_rel = 0.0005
tol_moment    = 0.0005

[test_1.4]
models         = test_shapes/shape_2_square_2p6m.h5
reflections    = 0, 2
sun_directions = 1, 4, 7, 9, 12
methods        = CentroidGPU, PixelGridGPU, CentroidCPU, PixelGridCPU, CentroidRTX, PixelGridRTX
group          = SolarArrayGroupL
tol_force_rel  = 0.0005

[test_1.7]
models_dirs   = SatForm3D_random100/models, SatForm3D_random100_hires/models
methods       = CentroidGPU, CentroidCPU, CentroidRTX
reflections   = 0
moment_ref    = center_of_mass
tol_median_coarse = 0.01                      # медиана медиан, сетка 0.5 м
tol_median_fine   = 0.003                     # медиана медиан, сетка 0.1 м
models_quick  = 10                            # первые 10 моделей в быстром режиме

[test_2.2]
models        = data3d_hdf5_0.5/satellite_62.h5, satform_polygons/sat_10.h5
